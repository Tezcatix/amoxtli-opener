<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" role="img" aria-label="Tapa de la caja Amoxtli">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f86" />
      <stop offset="1" stop-color="#1f1850" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b88a1a" />
      <stop offset="0.5" stop-color="#ffd76a" />
      <stop offset="1" stop-color="#b88a1a" />
    </linearGradient>
    <pattern id="crimp" width="12" height="120" patternUnits="userSpaceOnUse">
      <rect width="5" height="120" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
  </defs>
  <rect width="640" height="120" fill="url(#lid)" />
  <rect width="640" height="120" fill="url(#crimp)" />
  <rect y="0" width="640" height="8" fill="url(#gold)" />
  <rect y="104" width="640" height="16" fill="#0f1026" opacity="0.55" />
  <rect y="100" width="640" height="4" fill="url(#gold)" opacity="0.8" />
  <text x="320" y="68" text-anchor="middle" font-family="Satoshi, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" letter-spacing="12" fill="#f4f5f6" opacity="0.9">AMOXTLI</text>
</svg>
