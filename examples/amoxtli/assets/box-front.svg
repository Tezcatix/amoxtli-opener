<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Caja Amoxtli">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2160" />
      <stop offset="0.5" stop-color="#1c1640" />
      <stop offset="1" stop-color="#0f1026" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#604aff" stop-opacity="0.5" />
      <stop offset="0.6" stop-color="#604aff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#604aff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff" />
      <stop offset="0.5" stop-color="#4c3acc" />
      <stop offset="1" stop-color="#8b7bff" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b88a1a" />
      <stop offset="0.5" stop-color="#ffd76a" />
      <stop offset="1" stop-color="#b88a1a" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <path id="talon" d="M 0,0 Q 1.1,-0.9 2.3,-0.6 Q 1.3,-0.3 0.9,0.5 Q 0.5,-0.2 0,0 Z" fill="currentColor" />
    <path id="trident-prong" d="M 0,0 Q 0.9,-0.7 0.75,-1.9 Q 1.15,-1.75 1.05,-1.15" fill="none" stroke="currentColor" stroke-width="0.46" stroke-linecap="round" />
    <g id="corner-mark" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round">
      <path d="M -2.5,-0.75 L -0.55,-0.3" />
      <circle cx="0" cy="0" r="0.55" />
      <path d="M 0.3,0.55 L 0.12,2.4" />
    </g>
    <g id="emblem" stroke="currentColor" fill="none">
      <circle cx="0" cy="0" r="6.2" stroke-width="0.46" />
      <g stroke-width="0.46" stroke-linejoin="round">
        <g transform="rotate(0)"><path d="M 0.35,-4.55 A 4.55,4.55 0 0 1 3.2,-3.2" /><path d="M 1.3,-3.85 L 1.3,-3.15 L 2.15,-3.15" /></g>
        <g transform="rotate(90)"><path d="M 0.35,-4.55 A 4.55,4.55 0 0 1 3.2,-3.2" /><path d="M 1.3,-3.85 L 1.3,-3.15 L 2.15,-3.15" /></g>
        <g transform="rotate(180)"><path d="M 0.35,-4.55 A 4.55,4.55 0 0 1 3.2,-3.2" /><path d="M 1.3,-3.85 L 1.3,-3.15 L 2.15,-3.15" /></g>
        <g transform="rotate(270)"><path d="M 0.35,-4.55 A 4.55,4.55 0 0 1 3.2,-3.2" /><path d="M 1.3,-3.85 L 1.3,-3.15 L 2.15,-3.15" /></g>
      </g>
      <circle cx="0" cy="0" r="4.55" stroke-width="0.46" />
      <path d="M 0.5,0 A 0.85,0.85 0 0 1 0,0.85 A 1.2,1.2 0 0 1 -1.2,0 A 1.55,1.55 0 0 1 0,-1.55 A 1.9,1.9 0 0 1 1.9,0 A 2.25,2.25 0 0 1 0,2.25 A 2.6,2.6 0 0 1 -2.6,0 A 2.95,2.95 0 0 1 0,-2.95 A 3.3,3.3 0 0 1 3.3,0" stroke-width="0.54" stroke-linecap="round" />
      <g stroke-width="0.46" stroke-linecap="round">
        <path d="M 0,-6.55 L 0,-8.6" />
        <use href="#trident-prong" transform="translate(0,-6.6)" />
        <use href="#trident-prong" transform="translate(0,-6.6) scale(-1,1)" />
        <circle cx="0" cy="-6.55" r="0.35" />
        <path d="M 0,6.55 L 0,8.6" />
        <use href="#trident-prong" transform="translate(0,6.6) scale(1,-1)" />
        <use href="#trident-prong" transform="translate(0,6.6) scale(-1,-1)" />
        <circle cx="0" cy="6.55" r="0.35" />
      </g>
      <g transform="rotate(45) translate(0,-6.2)"><use href="#talon" transform="rotate(-18)" /><use href="#talon" transform="scale(0.85)" /><use href="#talon" transform="rotate(18) scale(0.7)" /></g>
      <g transform="rotate(135) translate(0,-6.2)"><use href="#talon" transform="rotate(-18)" /><use href="#talon" transform="scale(0.85)" /><use href="#talon" transform="rotate(18) scale(0.7)" /></g>
      <g transform="rotate(225) translate(0,-6.2)"><use href="#talon" transform="rotate(-18)" /><use href="#talon" transform="scale(0.85)" /><use href="#talon" transform="rotate(18) scale(0.7)" /></g>
      <g transform="rotate(315) translate(0,-6.2)"><use href="#talon" transform="rotate(-18)" /><use href="#talon" transform="scale(0.85)" /><use href="#talon" transform="rotate(18) scale(0.7)" /></g>
      <rect x="6.2" y="-0.8" width="1.3" height="1.6" fill="currentColor" />
      <rect x="-7.5" y="-0.8" width="1.3" height="1.6" fill="currentColor" />
    </g>
  </defs>

  <rect width="640" height="440" fill="url(#body)" />
  <circle cx="320" cy="230" r="230" fill="url(#glow)" />

  <!-- listones de foil abajo y a los lados -->
  <rect y="410" width="640" height="30" fill="url(#foil)" />
  <rect width="26" height="440" fill="url(#foil)" opacity="0.55" />
  <rect x="614" width="26" height="440" fill="url(#foil)" opacity="0.55" />

  <!-- marco -->
  <rect x="44" y="40" width="552" height="350" rx="16" fill="none" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2" />
  <g color="#a78bfa" opacity="0.85">
    <use href="#corner-mark" transform="translate(70,66) scale(3)" />
    <use href="#corner-mark" transform="translate(570,66) scale(-3,3)" />
    <use href="#corner-mark" transform="translate(70,364) scale(3,-3)" />
    <use href="#corner-mark" transform="translate(570,364) scale(-3,-3)" />
  </g>

  <!-- emblema y nombre -->
  <circle cx="320" cy="190" r="92" fill="none" stroke="url(#gold)" stroke-width="2.4" />
  <g color="#f4f5f6" transform="translate(320,190) scale(9.4)"><use href="#emblem" /></g>
  <text x="320" y="338" text-anchor="middle" font-family="Satoshi, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="700" letter-spacing="14" fill="#f4f5f6">AMOXTLI</text>
  <rect x="190" y="356" width="260" height="3" rx="1.5" fill="url(#gold)" />
  <text x="320" y="386" text-anchor="middle" font-family="Satoshi, Segoe UI, Roboto, sans-serif" font-size="17" letter-spacing="9" fill="#a78bfa">BUNDLE BOX</text>

  <rect width="640" height="440" fill="url(#sheen)" />
</svg>
